<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FATE'S CALL</title>
    <link rel="stylesheet" type="text/css" href="./css/mainMenu.css">
    <script src="./js/mainMenu.js"></script>
</head>
<body>

  <audio id="bgMusic" autoplay loop>
  <source src="./audio/menus_music.mp3" type="audio/mpeg">
  Your browser does not support the audio element.
  </audio>

<audio id="clickSound" preload="auto">
<source src="./audio/button_sound.mp3" type="audio/mpeg">
</audio>

<style>
  body {
    background-image: url('./Img/background/background3.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    height: 100vh;
    margin: 0;
  }
</style>

<h1 class="game-title">FATES CALL</h1>


<div class="container">
  <div class="left-side">
    <div id="username" class="username" >Logged in as: USERNAME</div>
    <div class="square-group">
      <div class="row">
        <div id="slot2" class="square"></div>
      </div>
      <div class="row">
        <div id="bigsqr" class="square"></div>
        <div id="slot4" class="square"></div>
        <div id="slot1" class="square"></div>
      </div>
      <div class="row">
        <div id="slot3" class="square"></div>
      </div>
    </div>
  </div>
  <div class="right-side">
    <button id="btn1" onclick="SearchMatch()" style="display:none">Search Match</button>
    <div id="searchingMatch" style="display:none">Waiting for a match...</div>
    <button id="btn3" onclick="QuitSearch()" style="display:none">Quit Search</button>
    <button id="btn2" onclick="TeamSelectPage()">Select Party</button>
  </div>
</div>
  <script>
      GetCurrentTeam()
      CheckMatchState()
      setInterval(CheckMatchState, 3000)
  </script>
</body>
</html>
