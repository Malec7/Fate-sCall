<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Select</title>
    <link rel="stylesheet" type="text/css" href="./css/teamSelect.css">
    <script src="./js/teamSelect.js"></script>
</head>
<body>

    <h1>Team Selection</h1>

<div class="container">
  <div class="left-side">
    <div id="username">username</div>
    <div id="history">match history</div>
    <div class="square-group2">
      <div class="row2">
        <!-- <div id="sqr16" class="square2"></div> -->
        <div type="text" id="slot2" class="square2" onclick="SelectSlot(this, 2)"></div>
      </div>
      <div class="row2">
        <!-- <div id="bigsqr" class="square2"></div>
        <div id="sqr17" class="square2"></div>
        <div id="sqr18" class="square2"></div> -->
        <input type="text" id="bigsqr" class="square2" onclick="">
        <div type="text" id="slot4" class="square2" onclick="SelectSlot(this, 4)"></div>
        <div type="text" id="slot1" class="square2" onclick="SelectSlot(this, 1)"></div>
      </div>
      <div class="row">
        <!-- <div id="sqr19" class="square2"></div> -->
        <div type="text" id="slot3" class="square2" onclick="SelectSlot(this, 3)"></div>
      </div>
    </div>
  </div>
  <div class="right-side">
    <div class="row">
        <div id="sqr1" class="square" onclick="selectBlessing(1)"></div>
        <div id="sqr2" class="square" onclick="selectBlessing(2)"></div>
        <div id="sqr3" class="square" onclick="selectBlessing(3)"></div>
        <div id="sqr4" class="square" onclick="selectBlessing(4)"></div>
    </div>
    <div class="row">DPS
        <div id="sqr5" class="square" onclick="selectUnit(1)"></div>
        <div id="sqr6" class="square" onclick="selectUnit(2)"></div>
        <div id="sqr7" class="square" onclick="selectUnit(3)"></div>
        <div id="sqr8" class="square" onclick="selectUnit(4)"></div>
        <div id="sqr9" class="square" onclick="selectUnit(5)"></div>
    </div>
    <div class="row">Tanks
        <div id="sqr10" class="square" onclick="selectUnit(6)"></div>
        <div id="sqr11" class="square" onclick="selectUnit(7)"></div>
        <div id="sqr12" class="square" onclick="selectUnit(8)"></div>
    </div>
    <div class="row">Supports
        <div id="sqr13" class="square" onclick="selectUnit(9)"></div>
        <div id="sqr14" class="square" onclick="selectUnit(10)"></div>
        <div id="sqr15" class="square" onclick="selectUnit(11)"></div>
    </div>
    <button id="btn" onclick="Return()">Return</button>
  </div>
</div>

<script>
  GetTeamState()
  setInterval(GetMatchState, 3000)
</script>
</body>
</html>
